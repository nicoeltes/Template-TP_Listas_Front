<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="filtros">
      <input type="search" id="buscador" placeholder="buscar por nombre, provincia o categoria">
      <select id="filtroCategoria">
        <option value="">Todas las categorias</option>
      </select>

      <select id="fitroProvincia">
        <option value="">Todas las provincias</option>
        </select>
    </header>


    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
  </main> 
  <footer class="addFood">
    <form class="formulario" id="agregarComidaForm">
      <h2>Agregar Comida</h2>
      <Label for="nombre">Nombre de la comida:</Label>
      <input type="text" id="nombre" placeholder="Nombre de la comida" required >
      <br>
      <Label for="provincia">Provincia:</Label>
      <input type="text" id="provincia" placeholder="provincia" required >
      <br>
      <Label for="categoria">categoria:</Label>
      <input type="text" id="categoria" placeholder="categoria" required >
      <br>
      <label for="ingredientes">Ingredientes(separados por ,):</label>
      <div class="agregartngredientes">
      <input type="text" id="ingredientes" placeholder="Ingredientes" required>
    </div>
    <button class="agregarIngrediente">+</button>
      <button type="submit">Agregar</button>
    </form>
  </footer>   
    <script type="module" src="./main.js"></script>
</body>
</html>
